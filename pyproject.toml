[project]
name = "animepahe-downloader"
version = "1.0.0"
description = "Animepahe scraper & downloader"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.24.0",
    "cloudscraper>=1.2.60",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "Levenshtein>=0.20.9",
    "undetected-chromedriver>=3.5.0",
    "selenium>=4.9.0",
    "curl-cffi>=0.5.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".kilo", "*worktree*", ".git", "__pycache__", ".pytest_cache"]
